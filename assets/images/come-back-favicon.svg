<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Come back emoji">
  <rect width="64" height="64" rx="14" fill="#0b1210"/>
  <!-- peeking face -->
  <circle cx="40" cy="34" r="20" fill="#3dba8c"/>
  <circle cx="40" cy="34" r="20" fill="url(#shine)" opacity="0.25"/>
  <!-- eyes -->
  <ellipse cx="33" cy="30" rx="3.2" ry="4" fill="#0b1210"/>
  <ellipse cx="45" cy="30" rx="3.2" ry="4" fill="#0b1210"/>
  <circle cx="34.2" cy="28.8" r="1" fill="#e8f0eb"/>
  <circle cx="46.2" cy="28.8" r="1" fill="#e8f0eb"/>
  <!-- smile -->
  <path d="M33 40c2.2 3.2 8.8 3.2 11 0" fill="none" stroke="#0b1210" stroke-width="2.4" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="29" cy="36" rx="3" ry="1.6" fill="#e8a54b" opacity="0.55"/>
  <ellipse cx="50" cy="36" rx="3" ry="1.6" fill="#e8a54b" opacity="0.55"/>
  <!-- waving hand -->
  <g transform="translate(8 38) rotate(-18)">
    <ellipse cx="10" cy="10" rx="7.5" ry="8.5" fill="#5ec4c0"/>
    <rect x="6" y="14" width="8" height="10" rx="3" fill="#5ec4c0"/>
    <!-- fingers -->
    <rect x="4" y="3" width="3.2" height="8" rx="1.6" fill="#5ec4c0" transform="rotate(-12 5.6 7)"/>
    <rect x="8.2" y="1.5" width="3.2" height="9" rx="1.6" fill="#5ec4c0"/>
    <rect x="12.4" y="3" width="3.2" height="8" rx="1.6" fill="#5ec4c0" transform="rotate(12 14 7)"/>
  </g>
  <!-- spark -->
  <circle cx="14" cy="16" r="2" fill="#e8a54b"/>
  <circle cx="20" cy="12" r="1.2" fill="#5ec4c0"/>
  <defs>
    <radialGradient id="shine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8f0eb"/>
      <stop offset="100%" stop-color="#3dba8c" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
