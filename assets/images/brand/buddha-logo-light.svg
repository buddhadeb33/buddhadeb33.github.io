      <stop offset="55%" stop-color="#0d8f68"/>
      <stop offset="100%" stop-color="#0a6b4e"/>
    </linearGradient>
    <linearGradient id="petalSoftL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f7a76"/>
